upstream crashkiller_backend {
    zone crashkiller_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2048m;
    client_body_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    # Unbuffered SSE stream for live crash analysis status and symbol sync progress
    location ~ ^/api/v1/(crashes/.+/events|symbols/public/sync/stream)$ {
        proxy_pass http://crashkiller_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Streaming API proxy (2GB crash/symbol uploads supported)
    location /api/ {
        proxy_pass http://crashkiller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # WinDbg / SymSrv symbol download proxy
    location /symsrv/ {
        proxy_pass http://crashkiller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Backend healthcheck passthrough
    location = /health {
        proxy_pass http://crashkiller_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Check the same admin credential as the API before serving the SPA.
    location = /_crashkiller_admin_auth {
        internal;
        proxy_pass http://crashkiller_backend/internal/admin-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # React SPA static fallback
    location / {
        auth_request /_crashkiller_admin_auth;
        try_files $uri $uri/ /index.html;
    }
}
